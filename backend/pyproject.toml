[project]
name = "spoiless"
version = "0.1.0"
description = "A local-first reading companion"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.115,<1",
    "fastembed>=0.7,<0.8",
    "keyring>=25,<26",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30,<1",
    "openai>=2,<3",
    "langchain-text-splitters>=1.0,<2",
    "langchain-core>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.hatch.build.targets.wheel]
packages = ["src"]
